<svg xmlns="http://www.w3.org/2000/svg" width="730" height="245" viewBox="0 0 730 245" role="img" aria-labelledby="title desc">
  <title id="title">The Earlyx compilation pipeline</title>
  <desc id="desc">Source becomes a semantic document, which branches into responsive HTML and shared positioned pages used by PDF and paged HTML.</desc>
