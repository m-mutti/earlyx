  </g>
  <g fill="#ffffff" stroke="#d6d9d0">
    <rect x="18" y="92" width="117" height="60" rx="9"/>
    <rect x="178" y="82" width="170" height="80" rx="9"/>
    <rect x="435" y="32" width="145" height="60" rx="9"/>
    <rect x="435" y="149" width="145" height="60" rx="9"/>
  </g>
  <g fill="#263238" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">
    <text x="76" y="128">Source</text>
    <text x="263" y="117">Semantic</text><text x="263" y="139">document</text>
    <text x="508" y="58">Responsive</text><text x="508" y="79">HTML</text>
    <text x="508" y="175">Positioned</text><text x="508" y="197">pages</text>
